name: Claude Cursor Connector

on:
  push:
    paths:
      - "claude-cursor-connector/**"
      - ".github/workflows/claude-cursor-connector.yml"
  pull_request:
    paths:
      - "claude-cursor-connector/**"
      - ".github/workflows/claude-cursor-connector.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: claude-cursor-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: claude-cursor-connector/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build
