name: Release APK

# Debug builds + unit tests run in android.yml on every push/PR; this workflow
# produces the release APK on tag pushes (v*) and manual dispatch.
#
# Signing credentials are optional. When the RELEASE_KEYSTORE_* secrets are set,
# the APK is signed with that keystore. When they are missing (the usual case
# until those secrets are added), Gradle falls back to the debug key so the
# job still uploads an installable APK instead of failing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode keystore if secret is present
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "Decoded release keystore from GitHub Actions secrets."
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set. Building a debug-signed release APK so it is still installable. Add the signing secrets (see README) for a stable release signature."
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bmw-assistant-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
